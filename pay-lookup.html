<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>薪水入帳查詢</title>
<style>
:root{--bg:#f6f7f4;--surface:#fff;--text:#1d2420;--muted:#66706a;--line:#dde2dc;--accent:#1f7a5a;--soft:#e3f1ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141815;--surface:#1c221e;--text:#e8ede9;--muted:#98a39c;--line:#2e3731;--accent:#5fcf9f;--soft:#1f3a2e}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.4rem;margin:0 0 12px}
.today{display:inline-block;background:#c8321e;color:#fff;font-weight:700;font-size:1rem;padding:6px 14px;border-radius:999px;margin-bottom:16px}
h2{font-size:1.05rem;margin:22px 0 8px;display:flex;align-items:center;gap:8px}
label{display:block;font-size:.9rem;color:var(--muted);margin-bottom:4px}
select{margin-top:12px}
input,select{width:100%;padding:10px;font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:8px}
input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.range{color:var(--muted);font-size:.9rem;margin:10px 0 0}
.list{display:grid;gap:8px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 12px}
.row .period{font-weight:600}
.row .pay{font-weight:700;text-align:right;color:var(--accent)}
.row .mid,.row .note{color:var(--muted);font-size:.85rem}
.row .note{grid-column:1/-1}
.empty{color:var(--muted);font-size:.9rem}
.foot{color:var(--muted);font-size:.8rem;margin-top:20px}
:root{--pink:#d70f64;--green:#1f7a5a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pink:#ff6aa5;--green:#5fcf9f}}
#sa .row{border-left:4px solid var(--pink)}
#sa .pay{color:var(--pink)}
#sb .row{border-left:4px solid var(--green)}
#sb .pay{color:var(--green)}
</style>
</head>
<body>
<main>
<h1>薪水入帳查詢</h1>
<div class="today" id="today"></div>
<label for="dt">選一個日期</label>
<input type="date" id="dt">
<label for="src" style="margin-top:12px">看哪一個</label>
<select id="src" style="margin-top:0"><option value="all">熊貓和 581</option><option value="a">只看熊貓</option><option value="b">只看 581（Uber）</option></select>
<p class="range" id="range"></p>
<section id="sa"><h2><svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="14" fill="#d70f64"/><circle cx="7" cy="8" r="3.2" fill="#222"/><circle cx="21" cy="8" r="3.2" fill="#222"/><ellipse cx="14" cy="15" rx="8" ry="7.5" fill="#fff"/><ellipse cx="10.5" cy="14" rx="2.2" ry="2.8" fill="#222"/><ellipse cx="17.5" cy="14" rx="2.2" ry="2.8" fill="#222"/><circle cx="10.5" cy="13.6" r=".8" fill="#fff"/><circle cx="17.5" cy="13.6" r=".8" fill="#fff"/><ellipse cx="14" cy="17.5" rx="1.6" ry="1.1" fill="#222"/></svg>熊貓</h2>
<div class="list" id="a"></div></section>
<section id="sb"><h2><svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="7" fill="#1f7a5a"/><text x="14" y="18.5" text-anchor="middle" font-size="11" font-weight="700" font-family="sans-serif" fill="#fff">581</text></svg>581（Uber）</h2>
<div class="list" id="b"></div></section>
<p class="foot">依固定規律推算，實際入帳以收款紀錄為準。</p>
</main>
<script>
var W=["日","一","二","三","四","五","六"],DAY=86400000;
function add(x,n){return new Date(x.getFullYear(),x.getMonth(),x.getDate()+n)}
function f(x){return (x.getMonth()+1)+"/"+x.getDate()+"（"+W[x.getDay()]+"）"}
function fr(a,b){return +a===+b?f(a):f(a)+" ～ "+f(b)}
function key(x){return x.getFullYear()+"-"+(x.getMonth()+1)+"-"+x.getDate()}
var NOTES={"2026-12-30":"1/1 元旦放假，可能順延","2027-1-13":"跨年週期","2027-2-10":"春節前後，實際日期請再確認","2027-2-8":"春節前後，實際日期請再確認"};
// 熊貓：週一到週日，期末後週三收信，再隔一週週三入帳
var PA=new Date(2026,10,8); // 期末錨點 11/8
function pandaRows(){var r=[];for(var k=-40;k<=40;k++){var e=add(PA,14*k),m=add(e,3),p=add(m,7);r.push({s:add(e,-13),e:e,mid:m,midLabel:"收信",p1:p,p2:p,note:NOTES[key(p)]||""})}return r}
// 581：週一到週一，週四結算，下週一出帳，入帳當週三～五
var UA=new Date(2026,10,9); // 期末錨點 11/9
function uberRows(){var r=[];for(var k=-40;k<=40;k++){var e=add(UA,14*k),m=add(e,3);r.push({s:add(e,-14),e:e,mid:m,midLabel:"結算",p1:add(e,9),p2:add(e,11),note:NOTES[key(add(e,9))]||""})}return r}
function show(id,rows,lo,hi){
var out=rows.filter(function(r){return (r.mid>=lo&&r.mid<=hi)||(r.p2>=lo&&r.p1<=hi)});
var el=document.getElementById(id);
if(!out.length){el.innerHTML='<div class="empty">這段期間沒有資料</div>';return}
el.innerHTML=out.map(function(r){
return '<div class="row"><div class="period">'+f(r.s).replace(/（.）/,"")+' ～ '+f(r.e).replace(/（.）/,"")+'</div><div class="pay">'+fr(r.p1,r.p2)+'</div><div class="mid">'+r.midLabel+' '+f(r.mid)+'</div>'+(r.note?'<div class="note">'+r.note+'</div>':'')+'</div>'}).join("")}
var AR=pandaRows(),BR=uberRows();
function run(){
var v=document.getElementById("dt").value;if(!v)return;
var p=v.split("-"),c=new Date(+p[0],+p[1]-1,+p[2]);
var lo=new Date(c.getFullYear(),c.getMonth()-1,c.getDate()),hi=new Date(c.getFullYear(),c.getMonth()+1,c.getDate());
document.getElementById("range").textContent="查詢範圍："+lo.getFullYear()+"/"+f(lo)+" ～ "+hi.getFullYear()+"/"+f(hi);
show("a",AR,lo,hi);show("b",BR,lo,hi);
var s=document.getElementById("src").value;
document.getElementById("sa").style.display=s==="b"?"none":"";
document.getElementById("sb").style.display=s==="a"?"none":""}
var n=new Date(),pad=function(x){return (x<10?"0":"")+x};
document.getElementById("dt").value=n.getFullYear()+"-"+pad(n.getMonth()+1)+"-"+pad(n.getDate());
document.getElementById("dt").addEventListener("input",run);
document.getElementById("src").addEventListener("change",run);
document.getElementById("today").textContent="今天 "+n.getFullYear()+"/"+(n.getMonth()+1)+"/"+n.getDate()+"（"+W[n.getDay()]+"）";
run();
</script>
</body>
</html>
